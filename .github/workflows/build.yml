name: build

on:
  push:
    branches: [main, github-actions]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the .exe files to a release on tag pushes

env:
  BIN_NAME: wiiu-pro-translator # must match `name` in Cargo.toml

jobs:
  build:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # one architecture failing must not cancel the other
      matrix:
        include:
          - arch: arm64
            # Native Windows 11 ARM64 runner (free for public repositories).
            runner: windows-11-arm
            rust_host: aarch64-pc-windows-msvc
            rustup_url: https://win.rustup.rs/aarch64
            pe_machine: 0xAA64
          - arch: x86_64
            runner: windows-latest
            rust_host: x86_64-pc-windows-msvc
            rustup_url: https://win.rustup.rs/x86_64
            pe_machine: 0x8664
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust_host }})
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest "${{ matrix.rustup_url }}" -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain stable --default-host ${{ matrix.rust_host }} --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          rustup default stable-${{ matrix.rust_host }}
          rustc -vV

      - name: Test
        shell: pwsh
        run: cargo test --release

      - name: Build
        shell: pwsh
        run: cargo build --release

      - name: Confirm the binary is ${{ matrix.arch }}
        shell: pwsh
        run: |
          $exe = "target\release\$env:BIN_NAME.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = [int]${{ matrix.pe_machine }}
          "PE machine type: 0x{0:X4} (expected 0x{1:X4})" -f $machine, $expected
          if ($machine -ne $expected) { throw "not a ${{ matrix.arch }} binary" }

      # Release assets share one namespace, so give each architecture its own file name.
      - name: Stage release file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\release\$env:BIN_NAME.exe" "dist\$env:BIN_NAME-windows-${{ matrix.arch }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-windows-${{ matrix.arch }}
          path: dist/${{ env.BIN_NAME }}-windows-${{ matrix.arch }}.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BIN_NAME }}-windows-${{ matrix.arch }}.exe
