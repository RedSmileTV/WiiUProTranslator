name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the .exe to a release on tag pushes

jobs:
  windows-arm64:
    # Native Windows 11 ARM64 runner (free for public repositories).
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-pc-windows-msvc)
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain stable --default-host aarch64-pc-windows-msvc --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          rustup default stable-aarch64-pc-windows-msvc
          rustc -vV

      - name: Test
        shell: pwsh
        run: cargo test --release

      - name: Build
        shell: pwsh
        run: cargo build --release

      - name: Confirm the binary is ARM64
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target\release\wiiu-pro-xinput.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          "PE machine type: 0x{0:X4} (0xAA64 = ARM64)" -f $machine
          if ($machine -ne 0xAA64) { throw "not an ARM64 binary" }

      - uses: actions/upload-artifact@v4
        with:
          name: wiiu-pro-xinput-windows-arm64
          path: target/release/wiiu-pro-xinput.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/wiiu-pro-xinput.exe
